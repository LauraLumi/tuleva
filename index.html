</style></head><body><a class="skip" href="#main">Liigu sisu juurde</a><header><a href="#" id="brand" aria-label="Avaleht">Tuleva<span> / pärimise teejuht</span></a><span class="tag">Sõltumatu hackathoni prototüüp</span></header><main id="main" tabindex="-1"></main><footer>Vastused püsivad ainult selle lehe mälus. Värskendamine kustutab need. Analüütikat ega vastuste edastamist pole.<br>Õiguslik ja Tuleva brändi heakskiit on veel saamata. <button class="link" id="clear">Kustuta vastused</button> · <button class="link" id="about">Allikad ja piirangud</button></footer><script>/* Pure functions. No DOM, network, persistence or framework dependencies. */
(function(root){
'use strict';
const VERSION='EE-2026-10-10-prototype.2';
const SOURCES={heirs:['Pärijate ring · Notarite Koda','https://parimine.notar.ee/parimine/kes-parib/'],law:['Pärimisseadus · Riigi Teataja','https://www.riigiteataja.ee/akt/114032025019'],property:['Perekonnaseadus · Riigi Teataja','https://www.riigiteataja.ee/akt/107052025017'],will:['Testament ja pärimisleping · Notarite Koda','https://parimine.notar.ee/parandamine/testament-parimisleping/'],estate:['Vara, ettevõte ja inventuur · Notarite Koda','https://parimine.notar.ee/parimine/mida-parib/'],pension:['Pensioniosakute pärimine · Tuleva','https://tuleva.ee/pensionifondi-osakute-parimine/'],international:['EL pärimismäärus · artiklid 21–22','https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A32012R0650']};
const hasPartner=s=>['married','registered'].includes(s.relationship);
function descendants(nodes,weight=1){
 const eligible=nodes.filter(n=>n.status==='alive'||(n.status==='dead'&&descendants(n.children||[]).length));
 return eligible.flatMap(n=>n.status==='alive'?[{id:n.id,name:n.name,share:weight/eligible.length,minor:!!n.minor}]:descendants(n.children||[],weight/eligible.length));
}
function unknownTree(nodes){return nodes.some(n=>!['alive','dead'].includes(n.status)||(n.status==='dead'&&(!n.complete||unknownTree(n.children||[]))));}
function merge(rows){const m=new Map();rows.forEach(r=>m.has(r.id)?m.get(r.id).share+=r.share:m.set(r.id,{...r}));return [...m.values()];}
function heirs(s){
 const reasons=[];if(s.scope!=='ee'||(s.assets||[]).some(a=>['yes','unknown'].includes(a.foreign)))reasons.push('Kohaldatav õigus vajab kontrolli.');
 if(!['married','registered','cohab','none'].includes(s.relationship))reasons.push('Perekonnaseis on teadmata.');
 if(s.instrument!=='none')reasons.push('Testament, pärimisleping või selle olemasolu tuleb enne jaotust kontrollida.');
 if(s.exceptions!=='clear')reasons.push('Erandlikud pärimisõiguse asjaolud vajavad ülevaatust.');
 if(!['none','list'].includes(s.childrenMode)||unknownTree(s.children||[]))reasons.push('Laste ja nende järglaste andmed on puudulikud.');
 if(s.childrenMode==='list'&&!(s.children||[]).length)reasons.push('Lisa laps või vali, et lapsi ei ole.');
 if(reasons.length)return {rows:[],reasons,level:'red',order:null};
 const childRows=s.childrenMode==='list'?descendants(s.children):[];
 let rows=[],order;
 if(childRows.length){
  order=1;const branches=s.children.filter(n=>descendants([n]).length).length;
  const share=hasPartner(s)?Math.max(1/(branches+1),.25):0;
  rows=childRows.map(r=>({...r,share:r.share*(1-share)}));
  if(share)rows.unshift({id:'partner',name:s.relationship==='registered'?'Registreeritud elukaaslane':'Abikaasa',share});
 }else{
  if(!s.parents||s.parents.some(p=>!['alive','dead'].includes(p.status))){return {rows:[],reasons:['Täpsusta mõlema vanema staatus.'],level:'red',order:2};}
  const deceased=s.parents.some(p=>p.status==='dead');
  if(deceased&&(s.siblingsComplete!=='yes'||unknownTree(s.siblings||[])||(s.siblings||[]).some(n=>!['both','maternal','paternal'].includes(n.side))))return {rows:[],reasons:['Täpsusta surnud vanemate laste, sh poolõdede ja poolvendade kõik harud.'],level:'red',order:2};
  const branches=s.parents.map((p,i)=>p.status==='alive'?[{id:p.id,name:p.name,share:1}]:descendants((s.siblings||[]).filter(n=>n.side==='both'||n.side===(i===0?'maternal':'paternal'))));
  const live=branches.filter(x=>x.length);
  if(live.length){order=2;const part=hasPartner(s)?.5:0;rows=merge(live.flatMap(b=>b.map(r=>({...r,share:r.share/live.length*(1-part)}))));if(part)rows.unshift({id:'partner',name:s.relationship==='registered'?'Registreeritud elukaaslane':'Abikaasa',share:part});}
  else if(hasPartner(s)){order=0;rows=[{id:'partner',name:s.relationship==='registered'?'Registreeritud elukaaslane':'Abikaasa',share:1}];}
  else return {rows:[],reasons:['Esimese ja teise järjekorra pärijaid ei ole. Vanavanemate ja nende järglaste kontroll (kolmas järjekord), teadmata pärijate otsing ning võimalik omavalitsuse või riigi pärimine tuleb teha notariga. Prototüüp ei arvuta seda haru.'],level:'red',order:3};
 }
 return {rows,reasons:[],level:order===2||s.children.some(n=>n.status==='dead')?'amber':'green',order};
}
const amount=v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))&&Number(v)>=0?Number(v):null;
function estate(s){
 const issues=[];let gross=0,debt=0;const assets=(s.assets||[]).map(a=>{
 let fraction=null;const reasons=[];
 if(a.kind==='pension2')fraction=1;
 else if(a.ownership==='separate')fraction=1;
 else if(a.ownership==='other')fraction=0;
 else if(a.ownership==='share'&&amount(a.percent)!==null&&Number(a.percent)<=100)fraction=Number(a.percent)/100;
 else if(a.ownership==='joint'&&hasPartner(s)&&s.regime==='community')fraction=.5;
 else reasons.push('Omandi liik või osa vajab täpsustamist');
 if(a.confirmed!=='yes')reasons.push('Omandi alus on kinnitamata');
 if(a.foreign!=='no')reasons.push('Välisvara või teadmata asukoht');
 if(a.disputed!=='no')reasons.push('Vaidlus või puudulik dokumentatsioon');
 if(['insurance','ip'].includes(a.kind))reasons.push('Lepingu või õiguse päritavus vajab kontrolli');
 if(['home','realestate','land'].includes(a.kind)&&a.rights!=='no')reasons.push('Kasutusõigus mõjutab väärtust');
 if(['home','realestate','land'].includes(a.kind)&&!['yes','no'].includes(a.mortgage))reasons.push('Hüpoteegi staatus on teadmata');
 if(a.kind==='pension2'&&a.ownership!=='separate')reasons.push('II samba osakute puhul kinnita, et need on sinu lahusvara');
 if(a.ownership==='joint'&&a.acquisition!=='during')reasons.push('Ühisvara ja omandamise alus vajavad kooskõlastamist');
 const v=amount(a.value);if(v===null)reasons.push('Väärtus on teadmata');
 const included=reasons.length?null:v*fraction;
 if(included!==null)gross+=included;
 return {...a,fraction,included,reasons};
 });
 const debts=(s.debts||[]).map(d=>{const v=amount(d.value);const known=v!==null&&d.confirmed==='yes'&&!['guarantee','contingent','business'].includes(d.kind);if(known)debt+=v;return {...d,included:known?v:null};});
 if(assets.some(a=>a.mortgage==='yes')&&!debts.some(d=>d.kind==='mortgage'))issues.push('Hüpoteegiga vara tagatud kohustus on lisamata; kontrolli ka võõra võla tagatist.');
 if(!s.assetComplete)issues.push('Vara loetelu ei ole kinnitatud täielikuks.');
 if(!s.debtComplete)issues.push('Kohustuste loetelu ei ole kinnitatud täielikuks.');
 if(assets.some(a=>a.included===null))issues.push('Mõne vara väärtus või pärandisse kuulumine on ebaselge.');
 if(debts.some(d=>d.included===null))issues.push('Mõne kohustuse ulatus on ebaselge.');
 if(hasPartner(s)&&!['community','separate'].includes(s.regime))issues.push(s.regime==='accrual'?'Vara juurdekasvu tasaarvestuse nõue on arvutamata.':'Varasuhe on teadmata.');
 if(s.previous!=='clear')issues.push('Varasem vara jagamine või varaleping vajab kontrolli.');
 return {assets,debts,gross,debt,net:issues.length?null:gross-debt,issues};
}
const RISK_RULES=[
 ['unknownrisk','amber','Riskikontroll pole täielik','Mõni pere või ülalpidamise riskiküsimus on vastamata või teadmata. Protsendijaotus üksi ei kinnita praktiliste riskide puudumist.','Ava riskiküsimused ja kontrolli ebaselged asjaolud koos notariga.','heirs',s=>['minor','blended','step','dependants','disinherit','foreignheir'].some(k=>!s.flags[k]||s.flags[k]==='unknown')],
 ['cohab','amber','Elukaaslane ei ole automaatselt pärija','Koos elamine ei anna seadusjärgset pärimisõigust. Tema enda omand jääb talle.','Arutage, kas vajate testamenti, pärimislepingut või eluaseme kasutusõiguse lahendust.','heirs',(s)=>s.relationship==='cohab'],
 ['minor','amber','Alaealine pärija','Vanem või eestkostja tegutseb lapse huvides. Pärandi inventuur on kohustuslik. Kinnisvara müük, koormamine ja pärandvara jagamine võivad nõuda kohtu eelnevat nõusolekut; huvide konflikti korral erieestkostjat.','Kontrolli notari juures esindust ja kohtu loa vajadust enne müüki või refinantseerimist.','property',(s,h)=>h.rows.some(r=>r.minor)||s.flags.minor==='yes'],
 ['home','amber','Kodu võib jääda pärandvara ühisusse','Mitme pärija korral ei muutu protsendid kohe kinnisasja mõttelisteks osadeks. Sinu õigused kodus võivad kuuluda pärijatele ühiselt kuni vara jagamiseni.','Leppige kokku, kes kodu kasutab ja kuidas oleks võimalik teiste pärijate osa hüvitada.','estate',(s,h)=>s.assets.some(a=>a.kind==='home')&&h.rows.length>1],
 ['blended','amber','Lapsed eri suhetest','Õiguslikel lastel on sama pärimisjärjekord. Partneri laps ja kasulaps ei päri sinult üksnes koos elamise tõttu.','Arutage kõigi laste ja partneri ootusi ning eluaseme kasutamist.','heirs',s=>s.flags.blended==='yes'||s.flags.step==='yes'],
 ['debt','amber','Pärandiga lähevad üle ka kohustused','Inventuur võib piirata pärija vastutust. Maksejõuetu pärandi korral võib lisaks vaja olla pärandvara pankrotti.','Koonda laenud, käendused ja võimalikud nõuded; räägi notariga inventuurist ja tähtaegadest.','estate',s=>s.debts.length>0||!s.debtComplete],

 ['pension','amber','Pensionivara ei ole tavaline pangaraha','II samba osakud on lahusvara; III sammas võib olla ühisvara. Päritud osakuid saab üldjuhul kanda oma pensionikontole või lunastada. Ülekanne ei tekita kohe tulumaksu, rahaline väljamakse võib olla maksustatav.','Kontrolli Tuleva juhendit. Kindlustusleping, välisresidentsus ja alaealise väljamakse vajavad eraldi kontrolli. Netoväljamakset me ei arvuta.','pension',s=>s.assets.some(a=>['pension2','pension3','insurance'].includes(a.kind))],

];
function risks(s,h,e){return RISK_RULES.filter(r=>r[6](s,h,e)).map(([id,severity,title,explanation,next,source])=>({id,severity,title,explanation,next,source})).sort((a,b)=>(a.severity==='red'?0:1)-(b.severity==='red'?0:1));}
function calculate(s){const h=heirs(s),e=estate(s);return {version:VERSION,heirs:h,estate:e,risks:risks(s,h,e)};}
const GOALS={yes:'Kui seadusjärgne jaotus sobib ja erandeid pole, ei ole ainult jaotuse pärast testamenti vaja. Hoia vara- ja kohustuste info leitavana ning vaata olukord pärast elumuutusi üle.',spouse:'Arutage notariga testamenti või pärimislepingut ning eluaseme kasutusõigust. Abieluvaraleping muudab vara koosseisu, mitte automaatselt pärijate ringi. Kontrollige sundosa ja laenukohustusi.',home:'Ühe inimese kasuks tehtav annak või pärandvara jagamise korraldus võib aidata kodu suunata soovitud isikule. Vajalik võib olla raha teiste pärijate nõuete katmiseks. Kinkimine viib omandi üle juba eluajal ja vajab eraldi riskianalüüsi.',children:'Erinevate osade määramiseks arutage testamenti või pärimislepingut. Kontrollige sundosa nõudeid ja alaealiste esindamist.',partner:'Registreerimata elukaaslase või heategevusorganisatsiooni kasuks saab teha testamendi või pärimislepingu. Kindlustuse soodustatud isiku määramine võib olla eraldi lahendus, sõltuvalt lepingust.',business:'Koostage ettevõtte jätkamise plaan: juhtimise asendamine, osanike leping ja põhikiri, hääleõigused ning osaluse väljaostu rahastus. See võib vajada enamat kui testamenti.',unsure:'Alusta küsimusest, kes peaks saama kodus edasi elada ja kelle sissetulek sinust sõltub. Võta kokkuvõte notariga arutamiseks kaasa.'};
const api={VERSION,SOURCES,GOALS,RISK_RULES,descendants,heirs,estate,calculate};if(typeof module!=='undefined')module.exports=api;root.InheritanceEngine=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script><script>'use strict';
const E=InheritanceEngine,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let serial=0;const id=()=>`p${++serial}`;
function fresh(){return {scope:'',relationship:'',instrument:'',childrenMode:'',children:[],parents:[{id:'mother',name:'Ema',status:''},{id:'father',name:'Isa',status:''}],siblings:[],siblingsComplete:'',exceptions:'',exceptionNotes:'',regime:'',previous:'',assets:[],debts:[],assetComplete:false,debtComplete:false,flags:{},willDate:'',willChanges:'',willLocation:'',willForm:'',goal:''};}
let profiles=[fresh(),fresh()],active=0,s=profiles[0],screen='landing',q=0,error='';
const fmt=v=>new Intl.NumberFormat('et-EE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v),pct=v=>new Intl.NumberFormat('et-EE',{maximumFractionDigits:2}).format(v*100)+'%';
const link=key=>`<a href="${E.SOURCES[key][1]}" target="_blank" rel="noopener noreferrer">${E.SOURCES[key][0]} ↗</a>`;
const buttons=()=>`<div class="actions"><button data-screen="result">← Ülevaatesse</button><button class="primary" data-screen="result">Uuenda ülevaadet →</button></div>`;
const choices=(key,options)=>`<div class="options">${options.map(([v,t,sub])=>`<label class="choice"><input type="radio" name="${key}" data-field="${key}" value="${v}" ${s[key]===v?'checked':''}><span><strong>${t}</strong>${sub?`<small>${sub}</small>`:''}</span></label>`).join('')}</div>`;
const select=(key,label,options,value=s[key],attr='')=>`<label>${label}<select data-field="${key}" ${attr}><option value="">Vali vastus</option>${options.map(([v,t])=>`<option value="${v}" ${value===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
const yn=[['yes','Jah'],['no','Ei'],['unknown','Ei tea']];
const input=(key,label,value,type='text',attr='')=>`<label>${label}<input type="${type}" data-field="${key}" value="${esc(value)}" ${attr}></label>`;
function nodeChips(nodes){return nodes.map(n=>`<div class="family-chip">${esc(n.name||'Laps')} ${n.status==='dead'?'†':''}${n.minor?' · alla 18':''}${n.status==='unknown'?' · teadmata':''}</div>${n.status==='dead'?`<div class="family-child">${nodeChips(n.children)}</div>`:''}`).join('');}
function family(){return `<aside class="side"><div class="eyebrow">Sinu perekaart</div><h3>Kes on sinu kõrval?</h3><div class="family-chip">Sina · vaade ${active+1}</div>${s.relationship&&s.relationship!=='none'?`<div class="family-chip">${({married:'Abikaasa',registered:'Registreeritud elukaaslane',cohab:'Elukaaslane',unknown:'Perekonnaseis teadmata'})[s.relationship]}</div>`:''}${nodeChips(s.children)}${s.childrenMode==='none'?'<p>Õiguslikke lapsi ega nende harusid ei ole märgitud.</p>':''}<p>Nimesid pole vaja. Kasuta näiteks „Laps 1“. Kaart ei kinnita isiku pärimisõigust.</p></aside>`;}
function shell(content,stage=0,side=true){return `<div class="steps" aria-label="Etapid">${['Pere ja õigus','Esialgne ülevaade','Vara ja kohustused','Sinu soovid'].map((t,i)=>`<span class="${i===stage?'active':''}" ${i===stage?'aria-current="step"':''}>${i+1}. ${t}</span>`).join('')}</div>${side?`<div class="layout"><section class="panel">${content}</section>${family()}</div>`:`<section class="panel">${content}</section>`}`;}
function landing(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">Et olulised asjad oleksid läbi mõeldud</div><h1>Mis saab<br>sinu varast?</h1><p class="lead">Vaata, kes võiks pärida. Mõista, mida see sinu lähedastele tähendab.</p><p>Alusta viiest teemast. Seejärel saad lisada vara, kohustused ja oma soovid.</p><button class="primary" data-action="start">Loo oma ülevaade →</button><p class="privacy">Anonüümne · kontot pole vaja · vastused ei lahku sellest lehest</p></div><div class="hero-art" aria-hidden="true"><div class="art-house">⌂</div><div class="art-person"><span>Sinu vara</span><b>Mis kuulub sulle?</b></div><div class="art-person"><span>Sinu pere</span><b>Kes võiks pärida?</b></div><div class="art-person"><span>Sinu soov</span><b>Mis võiks olla teisiti?</b></div><div class="hero-note">Pärandiosa ja osa sinu kodust ei ole sama asi.</div></div></div><div class="features"><div class="feature"><span>01</span><h3>Selge lähtekoht</h3><p>Seadusjärgne jaotus ainult siis, kui vastused seda võimaldavad.</p></div><div class="feature"><span>02</span><h3>Päris elu tagajärjed</h3><p>Kodu, lapsed, pensionivara ja võimalikud kohustused.</p></div><div class="feature"><span>03</span><h3>Mõistlik järgmine samm</h3><p>Vahel sobib olemasolev olukord. Vahel aitab vestlus notariga.</p></div></div><div class="note">See on planeerimise prototüüp, mitte pärimistunnistus ega täielikult valideeritud õigusnõuanne. Kõik reeglid vajavad enne avalikku kasutust Eesti pärimisõiguse spetsialisti heakskiitu.</div><button data-action="demo">Ava näide: abikaasa, 3 last ja ühine kodu</button>`;}
function nodeForm(nodes,type,depth=0){return nodes.map((n,i)=>`<div class="node"><div class="node-title"><strong>${depth?'Järglane':'Pere liige'} ${i+1}</strong><button class="remove" data-action="removeNode" data-id="${n.id}" data-tree="${type}">Eemalda</button></div><div class="fields">${input('name','Tähis (pärisnime pole vaja)',n.name,'text',`data-node="${n.id}" maxlength="60"`)}${select('status','Kas ta on elus?',[['alive','Elus'],['dead','Surnud'],['unknown','Ei tea']],n.status,`data-node="${n.id}"`)}${depth===0&&type==='siblings'?select('side','Milline vanem on teil ühine?',[['both','Mõlemad vanemad'],['maternal','Ema'],['paternal','Isa']],n.side,`data-node="${n.id}"`):''}</div>${n.status==='alive'?`<label class="check"><input type="checkbox" data-node="${n.id}" data-field="minor" ${n.minor?'checked':''}>Alla 18-aastane</label>`:''}${n.status==='dead'?`<p class="small">Lisa tema kõik õiguslikud lapsed. Surnud lapse haru saab samamoodi edasi avada.</p>${nodeForm(n.children,type,depth+1)}<button data-action="addNode" data-parent="${n.id}" data-tree="${type}">+ Lisa tema laps</button><label class="check"><input type="checkbox" data-node="${n.id}" data-field="complete" ${n.complete?'checked':''}>Kõik tema laste harud on lisatud, või tal ei olnud lapsi ega järglasi.</label>`:''}</div>`).join('');}
function familyForm(){const noDesc=s.childrenMode==='none'||(s.childrenMode==='list'&&s.children.length&&!E.descendants(s.children).length&&s.children.every(n=>n.status==='dead'&&n.complete));return `${choices('childrenMode',[['list','Mul on või on olnud lapsi','Ka lapsendatud ja varasemate suhete lapsed ning surnud laste harud.'],['none','Mul ei ole ega ole olnud õiguslikke lapsi'],['unknown','Ei tea / põlvnemine on ebaselge']])}${s.childrenMode==='list'?`${nodeForm(s.children,'children')}<button data-action="addNode" data-tree="children">+ Lisa laps</button>`:''}<div class="note">Lapsendatud laps on õiguslik laps. Lapsendamata kasulaps ja partneri laps ei kuulu üksnes koos elamise tõttu sinu laste pärimisharusse. Lapsendamise erandlik mõju sünniperele vajab kontrolli.</div>${noDesc?`<h3>Vanemad ja nende laste harud</h3><p class="small">Kui sinu laste harus pärijaid pole, on oluline teise järjekorra pärijate ring.</p><div class="fields">${s.parents.map((p,i)=>select('status',p.name,[['alive','Elus'],['dead','Surnud'],['unknown','Ei tea']],p.status,`data-parent-index="${i}"`)).join('')}</div>${s.parents.some(p=>p.status==='dead')?`${nodeForm(s.siblings,'siblings')}<button data-action="addNode" data-tree="siblings">+ Lisa õde, vend, poolõde või poolvend</button><div class="fields">${select('siblingsComplete','Kas kõik asjakohased õdede-vendade harud on kirjas?',[['yes','Jah, või neid ei ole'],['unknown','Ei tea / info pole täielik']])}</div><p class="small">Täisõde/-vend lisa üks kord ja vali „Mõlemad vanemad“. Ära lisa iseennast.</p>`:''}`:''}`;}
function questionnaire(){const pages=[
 ['Kas sinu olukord on seotud Eestiga?',`<p>Alustame sellest, kas lihtne Eesti õiguse vaade on sobiv.</p>${choices('scope',[['ee','Elan Eestis ja piiriülest erandit pole teada','Pole välisvara, välisriigi õiguse valikut ega välisriigi pereõiguslikku korraldust. Pärija välismaal elamise saad hiljem eraldi märkida.'],['foreign','Elan välismaal või on muu välisriigi seos'],['unknown','Ei tea']])}`],
 ['Milline on sinu perekonnaseis?',choices('relationship',[['married','Olen abielus'],['registered','Olen registreeritud kooselus','Notariaalne kooseluleping, mitte lihtsalt ühine aadress.'],['cohab','Elan koos partneriga, registreerimata'],['none','Mul ei ole abikaasat ega registreeritud elukaaslast'],['unknown','Ei tea / staatus on vaidlustatud']])],
 ['Kas oled pärimise juba korraldanud?',choices('instrument',[['none','Testamenti ega pärimislepingut ei ole'],['notarial','Mul on notariaalne testament'],['home','Mul on kodune testament'],['contract','Mul on pärimisleping'],['unknown','Ei tea']])+'<p class="small">Olemasoleva korralduse puhul aitame koguda küsimused notarile. Selle sisu arvestamata protsente ei näita.</p>'],
 ['Millised on sinu pere harud?',familyForm()],
 ['Kas mõni erand vajab arvestamist?',`<p>Kas esineb pärimisest loobumist või loobumislepingut, pärimiskõlbmatust, kellegi pärandist kõrvalejätmist, lahutamise menetlust, ebaselget surmade järjekorda, veel sündimata last, vaieldavat põlvnemist, lapsendamise erijuhtu, täielikku hooldusõiguse äravõtmist või teadmata pärijaid?</p>${choices('exceptions',[['clear','Ükski neist ei ole teadaolevalt asjakohane'],['review','Jah, vähemalt üks neist'],['unknown','Ma ei oska öelda']])}${s.exceptions&&s.exceptions!=='clear'?`<div class="fields">${input('exceptionNotes','Mida soovid notariga täpsustada? (valikuline)',s.exceptionNotes,'text','maxlength="300"')}</div><div class="note">Need asjaolud võivad muuta pärimisõigust. Me ei eemalda inimest automaatselt pärijate ringist.</div>`:''}`]
 ];const [title,body]=pages[q];return shell(`<div class="progress-label">Pere ja õigus · teema ${q+1} viiest</div><h2>${title}</h2>${body}<div class="error" role="alert">${esc(error)}</div><div class="actions"><button data-action="back">← Tagasi</button><button class="primary" data-action="next">${q===4?'Vaata esialgset ülevaadet':'Edasi'} →</button></div>`,0);}
const kinds=[['home','Kodu'],['realestate','Muu kinnisvara'],['land','Maa'],['bank','Pangakonto'],['investments','Investeeringud'],['securities','Väärtpaberid'],['pension2','II samba fondiosakud'],['pension3','III samba fondiosakud'],['vehicle','Sõiduk'],['valuables','Väärtuslikud esemed'],['business','Ettevõtte osalus'],['ip','Intellektuaalomandi varaline õigus'],['crypto','Krüptovara'],['insurance','Kindlustusleping / hüvitis'],['other','Muu vara']];
function assetForm(a,i){const at=`data-asset="${a.id}"`;return `<article class="asset"><div class="node-title"><h3>Vara ${i+1}</h3><button class="remove" data-action="removeAsset" data-id="${a.id}">Eemalda vara</button></div><div class="fields">${select('kind','Vara liik',kinds,a.kind,at)}${input('name','Tähis (nt kodu, mitte aadress)',a.name,'text',at+' maxlength="60"')}${input('value','Kogu vara väärtus eurodes (tühi = ei tea)',a.value,'number',at+' min="0" step="0.01"')}${select('acquisition','Kuidas see omandati?',[['during','Suhte ajal ostetud / kogutud'],['before','Enne abielu või registreeritud kooselu'],['gift','Kingitus'],['inheritance','Pärimine'],['other','Muu'],['unknown','Ei tea']],a.acquisition,at)}${select('ownership','Kellele vara kuulub?',[['separate','Minu lahusvara / ainuomand'],['joint','Meie praeguse suhte ühisvara'],['share','Minu kindel kaasomandiosa'],['other','Täielikult kellelegi teisele'],['unknown','Ei tea']],a.ownership,at)}${a.ownership==='share'?input('percent','Minu omandiosa kogu varast (%)',a.percent,'number',at+' min="0" max="100" step="0.01"'):''}${select('confirmed','Kas omand ja selle alus on dokumentidest kontrollitud?',yn,a.confirmed,at)}${select('foreign','Kas vara asub välismaal?',yn,a.foreign,at)}${select('disputed','Kas omand on vaieldav või dokumenteerimata?',yn,a.disputed,at)}${['home','realestate','land'].includes(a.kind)?`${select('rights','Kas kellelgi on elamisõigus või kasutusvaldus?',yn,a.rights,at)}${select('mortgage','Kas varale on seatud hüpoteek?',yn,a.mortgage,at)}`:''}</div>${a.kind==='pension2'?'<div class="note">II samba fondiosakud on lahusvara. III samba ja pensionikindlustuse jaoks kasuta eraldi vara kirjet.</div>':''}${a.kind==='pension3'?'<div class="note">III sammas võib olla ühisvara. Kontrolli kogumisperioodi ja varasuhet; konto nimi üksi seda ei otsusta.</div>':''}${a.kind==='business'?'<div class="note">Sisesta osaluse väärtus. Ära liida ettevõtte varasid ja laene isikliku pärandvara hulka. Märgi isiklik käendus kohustusena.</div>':''}${a.mortgage==='yes'?'<p class="small">Hüpoteegi summa ei ole laenujääk. Lisa tegelik kohustus eraldi, ühe korra. Ka võõra kohustuse tagatis võib vajada eraldi kontrolli.</p>':''}</article>`;}
function assets(){return shell(`<div class="eyebrow">Mis kuulub pärandvara hulka?</div><h2>Üks vara korraga.</h2><p>Enne pärijate vahel jagamist tuleb eraldada see, mis juba kuulub teisele omanikule.</p>${E.SOURCES.property?`<p class="small">${link('property')}</p>`:''}<div class="fields">${E.heirs&&['married','registered'].includes(s.relationship)?select('regime','Milline varasuhe kehtib?',[['community','Varaühisus'],['separate','Varalahusus'],['accrual','Vara juurdekasvu tasaarvestus'],['unknown','Ei tea']]):''}${select('previous','Varasemad suhted ja varalepingud',[['clear','Jagamata varasemat vara ega eritingimusi ei ole'],['review','Varasem ühisvara või varaleping vajab kontrolli'],['unknown','Ei tea']])}</div><details><summary>Mida need varasuhted tähendavad?</summary><p><b>Varaühisus:</b> vara ei muutu ühiseks üksnes abielu tõttu. Enne suhet omandatud, päritud ja kingitud vara on üldjuhul lahusvara; lepingud ja hüvitisnõuded võivad tulemust muuta.</p><p><b>Varalahusus:</b> omand selgitatakse välja iga vara kohta.</p><p><b>Juurdekasvu tasaarvestus:</b> omand ja juurdekasvu hüvitisnõue on eri asjad. Ilma mõlema poole alg- ja lõppvara, kohustuste ning lepinguta ei arvuta me pärandi netoväärtust.</p><p>Kinnistusraamatu kanne üksi ei pruugi lahendada ühisvara küsimust. Varasema abielu või registreeritud kooselu jagamata vara tuleb eraldi arvestada.</p></details>${s.assets.map(assetForm).join('')}<button data-action="addAsset">+ Lisa vara</button><label class="check"><input type="checkbox" data-field="assetComplete" ${s.assetComplete?'checked':''}>Olen lisanud kogu asjakohase vara (või vara ei ole).</label><h3 class="spaced">Kohustused</h3><p class="small">Sisesta pärandajale omistatav tegelik kohustus, mitte tagatise väärtus. Ühislaenu ei saa automaatselt pooleks jagada. Kui vastutuse ulatus pole kindel, vali „Ei tea“.</p>${s.debts.map((d,i)=>`<article class="debt"><div class="node-title"><strong>Kohustus ${i+1}</strong><button class="remove" data-action="removeDebt" data-id="${d.id}">Eemalda</button></div><div class="fields">${select('kind','Kohustuse liik',[['mortgage','Eluasemelaen'],['consumer','Tarbimislaen'],['lease','Liising'],['tax','Maksukohustus'],['private','Eraisiku laen'],['guarantee','Käendus'],['business','Ettevõtlusega seotud isiklik kohustus'],['contingent','Tingimuslik kohustus'],['other','Muu']],d.kind,`data-debt="${d.id}"`)}${input('name','Tähis / seotud vara',d.name,'text',`data-debt="${d.id}" maxlength="60"`)}${input('value','Pärandajale omistatav summa € (tühi = ei tea)',d.value,'number',`data-debt="${d.id}" min="0" step="0.01"`)}${select('confirmed','Kas vastutuse summa on kontrollitud?',yn,d.confirmed,`data-debt="${d.id}"`)}</div></article>`).join('')}<button data-action="addDebt">+ Lisa kohustus</button><label class="check"><input type="checkbox" data-field="debtComplete" ${s.debtComplete?'checked':''}>Kõik kohustused on lisatud (või kohustusi ei ole).</label>${buttons()}`,2);}
function confidence(h){return `<div class="confidence ${h.level}"><strong>${{green:'✓ Lihtne seadusjärgne stsenaarium',amber:'! Vajab andmete ja harude kontrolli',red:'! Automaatne jaotus peatatud'}[h.level]}</strong><p>${h.reasons.length?h.reasons.map(esc).join('<br>'):'Jaotus kehtib ainult sisestatud eeldustel. Roheline ei tähenda notari kinnitust.'}</p></div>`;}
const colors=['#086344','#498465','#719777','#9cb495','#bec9a8','#426b59'];
function shareTable(r){const h=r.heirs,e=r.estate;return h.rows.length?`<div class="chart" aria-hidden="true">${h.rows.map((row,i)=>`<span style="width:${row.share*100}%;background:${colors[i%colors.length]}"></span>`).join('')}</div><div aria-label="Pärandiosad">${h.rows.map(row=>`<div class="share-row"><span>${esc(row.name)}${row.minor?'<small>Alaealine</small>':''}</span><span><b>${pct(row.share)}</b>${e.net!==null&&e.net>=0&&!(h.order===2&&h.rows.some(x=>x.id==='partner'))?`<small>arvestuslikult ${fmt(e.net*row.share)}</small>`:''}</span></div>`).join('')}</div><p class="small">Osad käivad pärandvara terviku kohta. Summa on hinnang enne makse, kulusid ja võimalikke nõudeid, mitte lubatud väljamakse.</p><p class="small">${link('heirs')}</p>${h.order===2&&h.rows.some(row=>row.id==='partner')?'<div class="note">Abikaasa või registreeritud elukaaslase eelosa ning võimalik eluaseme kasutusõigus vajavad eraldi hindamist. Need ei sisaldu protsentide rahalises hinnangus.</div>':''}`:'<p>Protsente ja pärijate rahalisi summasid ei kuvata enne vajalike asjaolude kontrolli. Vara loetelu saad siiski koostada.</p>';}
function money(r){const e=r.estate;return `<div class="stat">${e.net===null?'Vajab täpsustamist':fmt(e.net)}</div><p class="small">${e.net===null?'Pärandvara netoväärtust ei saa veel hinnata.':'Sisestatud vara miinus kontrollitud kohustused. Hinnang, mitte turuhindade või nõuete audit.'}</p>${e.assets.map(a=>`<div class="money-row"><span>${esc(a.name||kinds.find(k=>k[0]===a.kind)?.[1]||'Vara')}<br><small>${a.fraction!==null?'Arvestatav omandiosa '+pct(a.fraction):'Omandiosa teadmata'}</small></span><strong>${a.included===null?'Kontrollida':fmt(a.included)}</strong></div>${a.reasons.length?`<p class="small">${a.reasons.map(esc).join('; ')}.</p>`:''}`).join('')}<div class="money-row"><span>Teadaolev vara vahesumma</span><strong>${fmt(e.gross)}</strong></div><div class="money-row"><span>Teadaolevad kohustused</span><strong>− ${fmt(e.debt)}</strong></div>${e.issues.length?`<ul class="small">${e.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p class="small">${link('estate')}</p>`;}
function practical(r){const homes=r.estate.assets.filter(a=>a.kind==='home');if(!homes.length)return '';return `<div class="note"><h3>Mida see kodu jaoks tähendab?</h3>${homes.map(a=>`<p>${esc(a.name||'Kodu')}: ${a.fraction!==null&&a.included!==null?`${pct(a.fraction)} vara väärtusest on selles hinnangus arvestatud sinu omandina.`:'Kõigepealt tuleb kontrollida, milline osa kuulub sulle.'} ${r.heirs.rows.length>1?'Sinu õigused võivad kuuluda pärijatele ühiselt. Müügiks või jagamiseks on vaja lahendada kõigi pärijate õigused.':r.heirs.rows.length===1?'Üks pärija ei kõrvalda teiste omanike, panga ega kasutusõiguse omajate õigusi.':'Pärijate koosseis vajab enne tagajärje hindamist kontrolli.'}</p>`).join('')}<p class="small">Näiteks 50% ühisvara osa ja 25% pärandiosa ei ole 25% kogu kodust. Kaaspärijate ühisus tekib enne konkreetsete esemete jagamist.</p></div>`;}
function riskCards(r){return r.risks.map(x=>`<article class="risk ${x.severity}"><div class="eyebrow">${x.severity==='red'?'Spetsialisti kontroll':'Tähelepanu'} · ${esc(x.id)}</div><h3>${x.title}</h3><p>${x.explanation}</p><p><b>Järgmine samm:</b> ${x.next}</p>${link(x.source)}</article>`).join('');}
function result(){const r=E.calculate(s);return shell(`<div id="full-result"><div class="result-head"><div><div class="eyebrow">Vaade ${active+1} · sinu esialgne tulemus</div><h2>Sinu pärimise ülevaade</h2></div><button data-action="editFamily">Muuda vastuseid</button></div>${confidence(r.heirs)}<div class="split"><section><h3><span class="badge-num">1</span>Mis kuulub pärandisse?</h3>${money(r)}<button class="primary" data-screen="assets">${s.assets.length?'Täpsusta vara':'Lisa vara ja kohustused'} →</button></section><section><h3><span class="badge-num">2</span>Kes võiks pärida?</h3>${shareTable(r)}</section></div>${practical(r)}<div class="spaced"><h3><span class="badge-num">3</span>Mida tähele panna?</h3><p class="small">Kaartide järjekord lähtub kontrollivajadusest, mitte uuringuga tõendatud probleemide sagedusest.</p><div class="risk-grid">${riskCards(r)}</div></div><div class="actions"><button data-screen="deep">Täpsusta riskiküsimusi</button><button class="primary" data-screen="goals">Kas tulemus vastab sinu soovidele? →</button></div><div class="actions"><button data-action="summary">Laadi kokkuvõte alla</button><button data-action="print">Prindi / salvesta PDF</button><button data-screen="compare">Võrdle kahte vaadet</button></div><p class="small muted">Reeglistik ${E.VERSION} · allikaid vaadatud 10.10.2026 · notari heakskiit puudub.</p></div><div class="print-only print-summary">${summaryHTML(r)}</div>`,1,false);}
const flagLabels={minor:'Kas võimalike pärijate seas on alaealisi?',blended:'Kas sul on lapsi varasematest suhetest?',step:'Kas peres on sinu poolt lapsendamata partneri lapsi või kasulapsi?',dependants:'Kas kellelgi võib olla sinu suhtes seaduslik ülalpidamisõigus?',disinherit:'Kas soovid kedagi pärandist ilma jätta?',foreignheir:'Kas mõni võimalik pärija elab välismaal?'};
function deep(){return shell(`<h2>Olulised täpsustused</h2><p>Need vastused aitavad märgata praktilisi riske. „Ei tea“ korral lisa teema notariga arutamiseks.</p><div class="fields">${Object.entries(flagLabels).map(([k,v])=>select(k,v,yn,s.flags[k],`data-flag="${k}"`)).join('')}</div>${s.instrument!=='none'?`<h3>Olemasolev testament või leping</h3><div class="fields">${input('willDate','Tegemise kuupäev (kui tead)',s.willDate,'date')}${select('willChanges','Kas pärast tegemist on olnud abielu, lahutus, uusi lapsi või vara muutusi?',yn,s.willChanges)}${select('willLocation','Kas tead, kus originaal või notariaalne dokument asub?',yn,s.willLocation)}${s.instrument==='home'?select('willForm','Koduse testamendi vorm',[['hand','Tervikuna omakäeline, kuupäeva ja allkirjaga'],['witness','Vähemalt kahe tunnistaja juures allkirjastatud'],['unknown','Muu / ei tea']]):''}</div><div class="note">${s.instrument==='home'?'Kuue kuu reegel kehtib, kui testaator selle aja möödudes elab. Vorm ja tunnistajate sobivus vajavad eraldi kontrolli. Kuupäeva sisestamine ei kinnita kehtivust.':'Notariaalne testament ei aegu lihtsalt vanuse tõttu, kuid elu muutumine võib nõuda selle ülevaatamist.'} ${link('will')}</div>`:''}<details><summary>Erandite meelespea</summary><p>Veel sündimata lapse puhul on oluline eostamise ja elusalt sündimise küsimus. Ebaselge surmade järjekorra puhul ei saa eeldada, et üks isik päris teiselt. Loobumine ja pärimiskõlbmatus võivad avada järglaste haru; pärandist kõrvalejätmine ja sundosast ilmajätmine pole sama asi.</p><p>Kui pärijad on teadmata, peab notar pärijate ringi välja selgitama; tööriist ei tohi anda vara automaatselt riigile. Need juhud on automaatarvutusest välja jäetud.</p>${link('law')}</details>${buttons()}`,2);}
function goals(){return shell(`<div class="eyebrow">Sinu järgmine samm</div><h2>Kas see vastab sinu soovidele?</h2>${choices('goal',[['yes','Jah, see jaotus sobib'],['spouse','Soovin kaitsta abikaasat või registreeritud elukaaslast'],['home','Soovin jätta kodu ühele inimesele'],['children','Soovin lastele teistsuguseid osi'],['partner','Soovin jätta vara elukaaslasele või heategevuseks'],['business','Soovin säilitada ettevõtte toimimise'],['unsure','Ma ei tea veel']])}${s.goal?`<div class="goal-output"><h3>Võimalik arutelu suund</h3><p>${E.GOALS[s.goal]}</p>${E.heirs(s).level==='red'?'<p><b>Tegelik jaotus on veel selgitamata.</b> Esmalt lahenda ülevaates märgitud küsimused.</p>':''}<p>See ei ole automaatne soovitus teha konkreetne tehing. Sobiv lahendus sõltub dokumentidest, maksudest ja lähedaste õigustest.</p>${link('will')}</div>`:''}<div class="actions"><button data-screen="result">← Ülevaatesse</button><a href="https://www.notar.ee/et/notarid/nimekiri" target="_blank" rel="noopener noreferrer">Leia notar ↗</a><button class="primary" data-action="summary">Võta kokkuvõte kaasa ↓</button></div>`,3);}
function compare(){return shell(`<h2>Kaks vaadet, üks arutelu.</h2><p>Koosta mõlema inimese olukord eraldi. See on kahe tänase surmastsenaariumi võrdlus, mitte järjestikuste surmade simulatsioon. Teise inimese pere ja vara ei kopeerita automaatselt.</p><div class="split">${profiles.map((p,i)=>{const r=E.calculate(p);return `<div class="note"><h3>Kui ${i===0?'mina':'teine inimene'} sureksin esimesena</h3><p>${r.heirs.rows.length?r.heirs.rows.map(x=>esc(x.name)+' '+pct(x.share)).join('<br>'):'Pärijate jaotus vajab täpsustamist.'}</p><p>Pärandvara: ${r.estate.net===null?'andmed puudulikud':fmt(r.estate.net)}</p><button data-action="profile" data-index="${i}">${i===active?'Muuda seda vaadet':'Ava see vaade'}</button></div>`;}).join('')}</div><p class="small">Mõlemad vaated säilivad vaid selle lehe mälus. Kokkuvõte ekspordib korraga aktiivse vaate.</p><button data-screen="result">← Aktiivse vaate ülevaatesse</button>`,3,false);}
function about(){return shell(`<h2>Allikad ja usalduspiir.</h2><p>Versioon <b>${E.VERSION}</b>. Allikaid vaadatud 10.10.2026. Tegemist on allikatele tugineva prototüübiga; täielikku juriidilist valideerimist ega notari heakskiitu ei ole tehtud.</p><div class="table-wrap"><table><thead><tr><th>Valdkond</th><th>Prototüübi käitumine</th></tr></thead><tbody><tr><td>Lapsed ja nende järglased</td><td>Rekursiivne harujaotus, sh surnud laste järglased. Puuduv info peatab protsendid.</td></tr><tr><td>Vanemad, õed-vennad, poolõed-vennad</td><td>Kahe vanemaliini jaotus; sama isiku osad liidetakse.</td></tr><tr><td>Abikaasa ja registreeritud elukaaslane</td><td>I järjekorraga vähemalt ¼; II järjekorraga ½; I ja II puudumisel kogu pärand. Eelosa ja kasutusõigust ei hinnastata.</td></tr><tr><td>Vanavanemad ja kaugemad pärijad</td><td>Kolmanda järjekorra ja teadmata pärijate juhtumid suunatakse notarile; täisarvutust pole.</td></tr><tr><td>Testament, pärimisleping, sundosa, loobumine ja erandid</td><td>Küsimused, juhised ja kontrollivajadus. Tegeliku jaotuse protsente ei arvutata.</td></tr><tr><td>Vara ja kohustused</td><td>Kasutaja kinnitatud omandiosad ja väärtused. Tasaarvestus, vaidlused ja lepingulised erandid peatavad netosumma.</td></tr><tr><td>Pension</td><td>II/III samba eristus, ülekanne ja lunastamine. Individuaalset maksu või netoväljamakset ei arvutata.</td></tr></tbody></table></div><h3 class="spaced">Miks me nii ütleme?</h3><ul>${Object.keys(E.SOURCES).map(k=>`<li>${link(k)}</li>`).join('')}</ul><details open><summary>Mis vajab enne päris kasutust heakskiitu?</summary><p>Eesti notar peab kinnitama reeglid, erandid, testpersoonad ja sõnastused. Tuleva peab kinnitama kujunduse ning tooni. Vajalikud on mobiili- ja abitehnoloogia kasutajatestid, mitte ainult koodi kontroll.</p><p>Analüütika on välja lülitatud. Plaan: mõõta ainult nõusolekul üldiseid etapisündmusi; mitte nimesid, summasid, perekonna koosseisu ega vastuseid. Riskide sageduse uurimine vajab eraldi privaatsushinnangut.</p></details><details><summary>Privaatsus</summary><p>Vastuseid hoitakse ainult JavaScripti mälus. Rakendus ei kasuta vastuste jaoks küpsiseid, localStorage’it, serverit ega analüütikat. Lehe avamise teenuse tehnilised logid on vastustest eraldi. Välislinkidel kehtivad sihtlehe tingimused. Allalaaditud kokkuvõtte ja selle jagamise eest otsustad sina.</p></details><button data-screen="result">Ülevaatesse</button>`,1,false);}
function summaryHTML(r){const unanswered=Object.entries(flagLabels).filter(([k])=>!s.flags[k]||s.flags[k]==='unknown').map(([,v])=>v);return `<h1>Minu pärimise olukord</h1><p>Planeerimise kokkuvõte · vaade ${active+1} · ${new Date().toLocaleDateString('et-EE')}<br>Reeglistik ${E.VERSION} · notari kinnitust ei ole.</p><h3>Pärijad ja kindlus</h3><p>${r.heirs.rows.length?r.heirs.rows.map(x=>`${esc(x.name)}: ${pct(x.share)}`).join(' · '):r.heirs.reasons.map(esc).join(' ')}</p><h3>Pärandvara hinnang</h3><p>${r.estate.net===null?'Lõppsumma teadmata. '+r.estate.issues.map(esc).join(' '):fmt(r.estate.net)+' enne makse, kulusid ja täiendavaid nõudeid.'}</p><p>${r.estate.assets.map(a=>`${esc(a.name||a.kind)}: ${a.included===null?'kontrollida':fmt(a.included)}`).join(' · ')||'Vara pole lisatud.'}</p><h3>Järgmised sammud</h3><ul>${r.risks.slice(0,5).map(x=>`<li><b>${x.title}:</b> ${x.next}</li>`).join('')||'<li>Vaata lähteandmed ja soovid üle.</li>'}</ul>${r.risks.length>5?`<p>Lisaks ${r.risks.length-5} tähelepanekut rakenduse ülevaates.</p>`:''}<h3>Minu soov</h3><p>${s.goal?E.GOALS[s.goal]:'Soov on veel täpsustamata.'}</p>${s.instrument!=='none'?`<p>Olemasolev korraldus: ${esc(s.instrument||'teadmata')}; tegemise kuupäev ${esc(s.willDate||'teadmata')}; hilisemad muutused ${esc(s.willChanges||'teadmata')}; leitavus ${esc(s.willLocation||'teadmata')}.</p>`:''}${s.exceptionNotes?`<p>Notarile: ${esc(s.exceptionNotes)}</p>`:''}${unanswered.length?`<p><b>Veel vastamata:</b> ${unanswered.map(esc).join(' ')}</p>`:''}<p class="small">Osad käivad kogu pärandi kohta, mitte üksikute esemete automaatse jaotuse kohta. Vara ja kohustused pole sõltumatult kontrollitud. Kokkuvõte ei ole testament ega pärimistunnistus.</p><p class="small">Allikad: ${link('heirs')} · ${link('estate')} · ${link('pension')} · ${link('law')}</p>`;}
function download(){const r=E.calculate(s);const html='<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minu pärimise olukord</title><style>body{max-width:850px;margin:35px auto;padding:20px;font:15px/1.5 system-ui;color:#203529}h1,h3{font-family:Georgia}h1{font-size:32px}h3{margin-bottom:5px}a{color:#086344}.small{font-size:12px}@media print{body{margin:0;font-size:10pt}h1{font-size:24pt}@page{size:A4;margin:12mm}}</style>'+summaryHTML(r)+'</html>';const a=document.createElement('a'),u=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.href=u;a.download='Minu_parimise_olukord.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function render(focus=true){error=error||'';$('#main').innerHTML=({landing,questionnaire,result,assets,deep,goals,compare,about}[screen]||landing)();if(focus){$('#main').focus();window.scrollTo({top:0,behavior:'instant'});}}
function findNode(nodes,key){for(const n of nodes){if(n.id===key)return n;const x=findNode(n.children||[],key);if(x)return x;}return null;}
function removeNode(nodes,key){for(let i=0;i<nodes.length;i++){if(nodes[i].id===key){nodes.splice(i,1);return true;}if(removeNode(nodes[i].children||[],key))return true;}return false;}
function newNode(){return {id:id(),name:'Laps / järglane',status:'',children:[],minor:false,complete:false,side:''};}
function update(t){const key=t.dataset.field;if(!key)return;let target=s;if(t.dataset.node)target=findNode([...s.children,...s.siblings],t.dataset.node);if(t.dataset.parentIndex!==undefined)target=s.parents[Number(t.dataset.parentIndex)];if(t.dataset.asset)target=s.assets.find(a=>a.id===t.dataset.asset);if(t.dataset.debt)target=s.debts.find(d=>d.id===t.dataset.debt);if(t.dataset.flag)target=s.flags;if(!target)return;target[key]=t.type==='checkbox'?t.checked:t.value;if(key==='childrenMode'&&target===s&&t.value!=='list')s.children=[];if(t.dataset.asset)s.assetComplete=false;if(t.dataset.debt)s.debtComplete=false;error='';}
document.addEventListener('input',e=>{if(e.target.matches('input:not([type=checkbox]):not([type=radio]),textarea'))update(e.target);});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.field)return;update(t);if(t.matches('select,input[type=radio],input[type=checkbox]')){const y=window.scrollY,selector=t.dataset.node?`[data-node="${t.dataset.node}"][data-field="${t.dataset.field}"]`:t.dataset.asset?`[data-asset="${t.dataset.asset}"][data-field="${t.dataset.field}"]`:`[data-field="${t.dataset.field}"]${t.type==='radio'?`[value="${t.value}"]`:''}`;render(false);const next=$(selector);if(next)next.focus({preventScroll:true});window.scrollTo(0,y);}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b)return;if(b.dataset.screen){screen=b.dataset.screen;render();return;}const a=b.dataset.action;if(!a)return;
 if(a==='start'){screen='questionnaire';q=0;}
 if(a==='next'){const key=['scope','relationship','instrument','childrenMode','exceptions'][q];if(!s[key]||(q===3&&s.childrenMode==='list'&&!s.children.length)){error='Palun vali vastus või lisa pere liige. Võid valida ka „Ei tea“. ';render(false);return;}if(q<4)q++;else screen='result';}
 if(a==='back'){if(q>0)q--;else screen='landing';}
 if(a==='editFamily'){q=0;screen='questionnaire';}
 if(a==='addNode'){const n=newNode();if(b.dataset.tree==='siblings'){n.name='Õde / vend';}const tree=s[b.dataset.tree];if(b.dataset.parent){const p=findNode(tree,b.dataset.parent);p.children.push(n);p.complete=false;}else{tree.push(n);if(b.dataset.tree==='siblings')s.siblingsComplete='';}render(false);document.querySelector(`[data-node="${n.id}"]`)?.focus();return;}
 if(a==='removeNode'){removeNode(s[b.dataset.tree],b.dataset.id);}
 if(a==='addAsset'){s.assets.push({id:id(),kind:'home',name:'',value:'',ownership:'',percent:'',acquisition:'',confirmed:'',foreign:'',disputed:'',rights:'',mortgage:''});s.assetComplete=false;render(false);document.querySelector('.asset:last-of-type')?.scrollIntoView({block:'center'});return;}
 if(a==='removeAsset'){s.assets=s.assets.filter(x=>x.id!==b.dataset.id);s.assetComplete=false;}
 if(a==='addDebt'){s.debts.push({id:id(),kind:'mortgage',name:'',value:'',confirmed:''});s.debtComplete=false;render(false);document.querySelector('.debt:last-of-type')?.scrollIntoView({block:'center'});return;}
 if(a==='removeDebt'){s.debts=s.debts.filter(x=>x.id!==b.dataset.id);s.debtComplete=false;}
 if(a==='summary'){download();return;}
 if(a==='print'){screen='result';render();window.print();return;}
 if(a==='profile'){active=Number(b.dataset.index);s=profiles[active];q=0;screen='questionnaire';}
 if(a==='demo'){s=fresh();s.scope='ee';s.relationship='married';s.instrument='none';s.childrenMode='list';s.children=[1,2,3].map((x)=>({...newNode(),name:`Laps ${x}`,status:'alive',minor:x===3}));s.exceptions='clear';s.regime='community';s.previous='clear';s.assets=[{id:id(),kind:'home',name:'Perekodu',value:'240000',ownership:'joint',percent:'',acquisition:'during',confirmed:'yes',foreign:'no',disputed:'no',rights:'no',mortgage:'no'}];s.assetComplete=true;s.debtComplete=true;profiles[active]=s;screen='result';}
 render();});
$('#brand').addEventListener('click',e=>{e.preventDefault();screen='landing';render();});$('#about').addEventListener('click',()=>{screen='about';render();});render();

$('#clear').addEventListener('click',()=>{if(window.confirm('Kustutan mõlema vaate vastused selle lehe mälust?')){profiles=[fresh(),fresh()];active=0;s=profiles[0];q=0;screen='landing';render();}});
</script></body></html>
